<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 800" font-family="Segoe UI, Arial, sans-serif" font-size="15">
  <title>System diagram of Kitchen Teammate</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#33403e"/></marker>
    <style>
      .b{fill:#eaf3f0;stroke:#17635c;stroke-width:2}.ai{fill:#fdebdc;stroke:#c75f14;stroke-width:2}.h{fill:#e3ecf8;stroke:#2463b0;stroke-width:2}
      .s{fill:#f5f1dd;stroke:#8a7420;stroke-width:2;stroke-dasharray:3 4}.p{fill:#fff;stroke:#777;stroke-width:2;stroke-dasharray:9 6}
      .l{fill:none;stroke:#33403e;stroke-width:2;marker-end:url(#a)}.d{fill:none;stroke:#777;stroke-width:2;stroke-dasharray:9 6;marker-end:url(#a)}
      .t{font-weight:600;text-anchor:middle;fill:#1d2b2a}.n{font-size:13px;text-anchor:middle;fill:#43514f}.e{font-size:13px;fill:#33403e}
    </style>
  </defs>
  <rect width="1160" height="800" fill="#fff"/>

  <rect class="h" x="30" y="30" width="200" height="60" rx="8"/><text class="t" x="130" y="57">Player (chef 1)</text><text class="n" x="130" y="77">goals, moves, words</text>
  <rect class="s" x="30" y="120" width="200" height="54" rx="8"/><text class="t" x="130" y="143">Scripted chef 1</text><text class="n" x="130" y="162">trials only</text>
  <rect class="b" x="400" y="30" width="360" height="60" rx="8"/><text class="t" x="580" y="57">Browser interface</text><text class="n" x="580" y="77">board, orders, goals, chat, choice cards</text>
  <rect class="p" x="930" y="30" width="200" height="60" rx="8"/><text class="t" x="1030" y="57">Speech input</text><text class="n" x="1030" y="77">planned</text>
  <path class="l" d="M230 50H398"/><text class="e" x="262" y="43">keys, clicks, text</text>
  <path class="l" d="M400 76H232"/><text class="e" x="262" y="93">feedback</text>
  <path class="d" d="M930 60H762"/>

  <rect class="b" x="30" y="255" width="200" height="80" rx="8"/><text class="t" x="130" y="285">Game engine</text><text class="n" x="130" y="305">kitchen, pots, score</text><text class="n" x="130" y="322">order queue</text>
  <path class="l" d="M130 174V253"/><text class="e" x="140" y="218">chef 1 moves</text>
  <path class="l" d="M430 90V222H180V253"/><text class="e" x="255" y="214">chef 1 moves</text>

  <rect class="b" x="310" y="255" width="210" height="80" rx="8"/><text class="t" x="415" y="285">Context builder</text><text class="n" x="415" y="305">state, possible goals</text><text class="n" x="415" y="322">costs, consequences</text>
  <path class="l" d="M230 295H308"/><text class="e" x="243" y="287">state</text>

  <rect class="ai" x="610" y="140" width="200" height="70" rx="8"/><text class="t" x="710" y="168">Haiku: understand</text><text class="n" x="710" y="190">text to structured act</text>
  <path class="l" d="M710 90V138"/><text class="e" x="720" y="119">message</text>
  <rect class="b" x="900" y="140" width="220" height="70" rx="8"/><text class="t" x="1010" y="168">Rules and requests</text><text class="n" x="1010" y="190">visible, undoable</text>
  <path class="l" d="M810 175H898"/><text class="e" x="836" y="167">act</text>
  <path class="l" d="M760 76H860V130H960V138"/><text class="e" x="866" y="122">clicked request</text>

  <rect class="ai" x="610" y="255" width="200" height="80" rx="8"/><text class="t" x="710" y="285">Jev: choose</text><text class="n" x="710" y="305">goal scores, confidence</text><text class="n" x="710" y="322">ask for help?</text>
  <path class="l" d="M520 280H608"/><text class="e" x="530" y="272">on events</text>
  <rect class="b" x="610" y="385" width="200" height="60" rx="8"/><text class="t" x="710" y="411">Rule-based planner</text><text class="n" x="710" y="431">baseline and fallback</text>
  <path class="l" d="M710 335V383"/><text class="e" x="720" y="364">failure or limit</text>

  <rect class="b" x="900" y="275" width="220" height="140" rx="8"/><text class="t" x="1010" y="302">Guard (code)</text><text class="n" x="1010" y="326">still possible?</text><text class="n" x="1010" y="347">breaks a rule?</text><text class="n" x="1010" y="368">costly request?</text><text class="n" x="1010" y="389">confident enough?</text>
  <path class="l" d="M810 295H898"/><text class="e" x="822" y="287">proposal</text>
  <path class="l" d="M810 415H850V390H898"/>
  <path class="l" d="M1010 210V273"/><text class="e" x="1020" y="247">request, limits</text>

  <rect class="b" x="310" y="470" width="210" height="70" rx="8"/><text class="t" x="415" y="498">Goal runner</text><text class="n" x="415" y="520">pathfinding, one move a tick</text>
  <path class="l" d="M930 415V495H522"/><text class="e" x="640" y="488">act: approved goal</text>
  <path class="l" d="M310 505H130V337"/><text class="e" x="150" y="498">chef 2 moves</text>

  <rect class="b" x="900" y="560" width="220" height="70" rx="8"/><text class="t" x="1010" y="588">Message brief</text><text class="n" x="1010" y="610">verdict and facts only</text>
  <path class="l" d="M1030 415V558"/><text class="e" x="944" y="455">refuse, warn,</text><text class="e" x="944" y="473">object, ask</text>
  <rect class="ai" x="610" y="560" width="200" height="70" rx="8"/><text class="t" x="710" y="588">Haiku: word it</text><text class="n" x="710" y="610">never decides</text>
  <path class="l" d="M900 595H812"/><text class="e" x="836" y="587">brief</text>
  <rect class="b" x="310" y="560" width="210" height="70" rx="8"/><text class="t" x="415" y="588">Wording check</text><text class="n" x="415" y="610">otherwise use template</text>
  <path class="l" d="M610 595H522"/><text class="e" x="545" y="587">draft</text>
  <path class="l" d="M310 600H14V108H450V92"/><text class="e" x="24" y="592">reply to interface</text>
  <path class="l" d="M1120 345H1146V12H580V28"/><text class="e" x="772" y="27">choice cards, ranked goals</text>

  <rect class="b" x="310" y="675" width="210" height="60" rx="8"/><text class="t" x="415" y="701">Decision log</text><text class="n" x="415" y="721">scores, facts, messages</text>
  <path class="l" d="M1080 415V540H1140V705H522"/><text class="e" x="900" y="697">every decision</text>
  <rect class="p" x="30" y="675" width="200" height="60" rx="8"/><text class="t" x="130" y="701">Player preferences</text><text class="n" x="130" y="721">planned, learned from log</text>
  <path class="d" d="M310 705H232"/>

  <g font-size="13"><rect class="b" x="590" y="750" width="26" height="18"/><text x="624" y="764">Implemented</text><rect class="ai" x="722" y="750" width="26" height="18"/><text x="756" y="764">Implemented, AI model</text><rect class="s" x="918" y="750" width="26" height="18"/><text x="952" y="764">Simulated</text><rect class="p" x="1036" y="750" width="26" height="18"/><text x="1070" y="764">Planned</text></g>
</svg>
