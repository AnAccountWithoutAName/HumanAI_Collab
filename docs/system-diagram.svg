<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" font-family="Segoe UI, Arial, sans-serif" font-size="17">
  <title>Adaptive goal planning architecture</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#33403e"/></marker>
    <style>
      .b{fill:#eaf3f0;stroke:#17635c;stroke-width:2}.ai{fill:#fdebdc;stroke:#c75f14;stroke-width:2}.h{fill:#e3ecf8;stroke:#2463b0;stroke-width:2}
      .l{fill:none;stroke:#33403e;stroke-width:2;marker-end:url(#a)}.w{fill:none;stroke:#33403e;stroke-width:2;marker-end:url(#a);marker-start:url(#a)}
      .t{font-weight:600;text-anchor:middle;fill:#1d2b2a}.n{font-size:14px;text-anchor:middle;fill:#43514f}.e{font-size:14px;fill:#33403e}.m{font-size:14px;fill:#8a3d05;font-weight:600}
    </style>
  </defs>
  <rect width="1040" height="560" fill="#fff"/>

  <rect class="h" x="30" y="30" width="180" height="70" rx="8"/><text class="t" x="120" y="71">Human</text>
  <rect class="b" x="330" y="30" width="180" height="70" rx="8"/><text class="t" x="420" y="71">Interface</text>
  <rect class="ai" x="800" y="30" width="210" height="70" rx="8"/><text class="t" x="905" y="60">Haiku</text><text class="n" x="905" y="83">understands and words</text>
  <path class="w" d="M212 65H328"/><text class="e" x="226" y="56">input, feedback</text>
  <path class="l" d="M510 52H798"/><text class="e" x="610" y="44">message</text>
  <path class="l" d="M800 80H512"/><text class="e" x="610" y="98">reply, checked</text>

  <rect class="h" x="30" y="290" width="180" height="80" rx="8"/><text class="t" x="120" y="323">Environment</text><text class="n" x="120" y="347">kitchen benchmark</text>
  <rect class="b" x="310" y="290" width="180" height="80" rx="8"/><text class="t" x="400" y="323">Context builder</text><text class="n" x="400" y="347">possible goals, effects</text>
  <rect class="ai" x="590" y="290" width="140" height="80" rx="8"/><text class="t" x="660" y="323">Jev</text><text class="n" x="660" y="347">scores goals</text>
  <rect class="b" x="820" y="290" width="190" height="80" rx="8"/><text class="t" x="915" y="323">Guard</text><text class="n" x="915" y="347">act, ask, object, refuse</text>

  <path class="w" d="M370 102V180H120V288"/><text class="e" x="150" y="172">human moves, display</text>
  <path class="l" d="M210 330H308"/><text class="e" x="221" y="320">raw state</text>
  <path class="l" d="M490 330H588"/>
  <text class="m" x="310" y="215">game state</text><text class="e" x="310" y="234">orders, deadlines, pots,</text><text class="e" x="310" y="253">held items, recent actions</text>
  <text class="m" x="497" y="215">goal menu</text><text class="e" x="497" y="234">time, consequences</text>
  <path d="M539 262V322" fill="none" stroke="#8a3d05" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path d="M310 262H620" fill="none" stroke="#8a3d05" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path class="l" d="M730 330H818"/><text class="e" x="742" y="320">scores</text>

  <path class="w" d="M850 288V180H450V102"/><text class="e" x="590" y="172">requests, choices</text>
  <path class="l" d="M900 100V288"/><text class="e" x="907" y="145">act</text>
  <path class="l" d="M965 290V102"/><text class="e" x="972" y="145">verdict,</text><text class="e" x="972" y="163">facts</text>

  <rect class="b" x="590" y="388" width="140" height="42" rx="8"/><text class="n" x="660" y="414">Rules (fallback)</text>
  <path class="l" d="M660 370V386"/>
  <path class="l" d="M730 409H770V355H818"/>
  <rect class="b" x="820" y="450" width="190" height="70" rx="8"/><text class="t" x="915" y="480">Memory</text><text class="n" x="915" y="503">rules, chat, decisions</text>
  <path class="w" d="M940 372V448"/>
  <rect class="b" x="310" y="450" width="180" height="70" rx="8"/><text class="t" x="400" y="480">Goal runner</text><text class="n" x="400" y="503">pathfinding</text>
  <path class="l" d="M870 370V440H790V485H492"/><text class="e" x="570" y="477">approved goal</text>
  <path class="l" d="M310 485H120V372"/><text class="e" x="180" y="477">AI moves</text>

  <g font-size="14"><rect class="b" x="30" y="535" width="24" height="16"/><text x="62" y="548">Code</text><rect class="ai" x="125" y="535" width="24" height="16"/><text x="157" y="548">AI model</text><rect class="h" x="245" y="535" width="24" height="16"/><text x="277" y="548">Human and environment</text><text x="640" y="548">Everything shown is implemented</text></g>
</svg>
